<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Closet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Anime.js y Lucide via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
    <!-- Navbar con links a: Closet, Subir prenda, Generar outfit, Historial -->
    <nav>
        <a class="nav-logo" href="index.html">Outfit</a>
        <ul class="nav-links">
            <li><a href="closet.html" aria-current="page">Closet</a></li>
            <li><a href="upload.html">Subir prenda</a></li>
            <li><a href="generate.html">Generar outfit</a></li>
            <li><a href="history.html">Historial</a></li>
        </ul>
    </nav>

    <div class="contenedor">
        <div class="contenedor-header">
            <h1>Mi Closet</h1>
        </div>

        <!-- Barra de filtros -->
        <div class="filtros-bar" id="filtros-bar">
            <select class="filtro-select" id="filtro-tipo" aria-label="Filtrar por tipo">
                <option value="todos">Todos los tipos</option>
                <option value="camiseta">Camiseta</option>
                <option value="camisa">Camisa</option>
                <option value="blusa">Blusa</option>
                <option value="sudadera">Sudadera</option>
                <option value="abrigo">Abrigo</option>
                <option value="chaqueta">Chaqueta</option>
                <option value="pantalon">Pantalón</option>
                <option value="jeans">Jeans</option>
                <option value="shorts">Shorts</option>
                <option value="falda">Falda</option>
                <option value="vestido">Vestido</option>
                <option value="zapatos">Zapatos</option>
                <option value="tenis">Tenis</option>
                <option value="botas">Botas</option>
                <option value="sandalias">Sandalias</option>
            </select>
            <select class="filtro-select" id="filtro-color" aria-label="Filtrar por color">
                <option value="todos">Todos los colores</option>
                <option value="negro">Negro</option>
                <option value="blanco">Blanco</option>
                <option value="gris">Gris</option>
                <option value="azul">Azul</option>
                <option value="rojo">Rojo</option>
                <option value="verde">Verde</option>
                <option value="amarillo">Amarillo</option>
                <option value="naranja">Naranja</option>
                <option value="morado">Morado</option>
                <option value="rosa">Rosa</option>
                <option value="cafe">Café</option>
                <option value="beige">Beige</option>
            </select>
            <select class="filtro-select" id="filtro-estilo" aria-label="Filtrar por estilo">
                <option value="todos">Todos los estilos</option>
                <option value="casual">Casual</option>
                <option value="formal">Formal</option>
                <option value="deportivo">Deportivo</option>
                <option value="elegante">Elegante</option>
            </select>
            <select class="filtro-select" id="filtro-temporada" aria-label="Filtrar por temporada">
                <option value="todos">Todas las temporadas</option>
                <option value="todas">Todas</option>
                <option value="primavera">Primavera</option>
                <option value="verano">Verano</option>
                <option value="otoño">Otoño</option>
                <option value="invierno">Invierno</option>
            </select>
            <button class="btn-secundario" id="filtros-limpiar" aria-label="Limpiar filtros">
                <i data-lucide="x"></i> Limpiar
            </button>
        </div>

        <!-- Grilla de prendas — se llena dinámicamente con JS -->
        <div class="grid-prendas stagger-children" id="grid-prendas">
            <!-- closet.js inyecta las cards aquí -->
        </div>

        <!-- Mensaje cuando no hay prendas -->
        <div id="mensaje-vacio" style="display:none" class="animate-fade-in empty-state">
            <i data-lucide="shirt" class="empty-state-icon"></i>
            <p>No tienes prendas todavía.</p>
            <a href="upload.html" class="btn-primario">
                <i data-lucide="plus"></i> Sube tu primera prenda
            </a>
        </div>
    </div>

    <!-- Lightbox para detalle de prenda -->
    <div class="lightbox-overlay" id="lightbox-prenda" role="dialog" aria-modal="true" aria-labelledby="lightbox-titulo">
        <div class="lightbox-panel">
            <header class="lightbox-header">
                <h2 id="lightbox-titulo">Detalle de prenda</h2>
                <button class="lightbox-close" id="lightbox-cerrar" aria-label="Cerrar detalle">
                    <i data-lucide="x"></i>
                </button>
            </header>
            <div class="lightbox-body">
                <img class="lightbox-imagen" id="lightbox-imagen" src="" alt="">
                <div class="lightbox-info-grid" id="lightbox-info">
                    <!-- Campos dinámicos -->
                </div>
                <div class="lightbox-campo" style="grid-column: 1 / -1;">
                    <span class="lightbox-campo-label">Notas</span>
                    <p class="lightbox-notas" id="lightbox-notas">—</p>
                </div>
            </div>
            <footer class="lightbox-footer">
                <button class="btn-primario" id="lightbox-editar" aria-label="Editar prenda">
                    <i data-lucide="edit-2"></i> Editar
                </button>
                <button class="btn-peligro" id="lightbox-eliminar" aria-label="Eliminar prenda">
                    <i data-lucide="trash-2"></i> Eliminar
                </button>
                <button class="btn-secundario" id="lightbox-cancelar" style="display:none;" aria-label="Cancelar edición">
                    <i data-lucide="x"></i> Cancelar
                </button>
            </footer>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- api.js primero, luego ui.js, luego closet.js -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/closet.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
