<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit AI</title>
    <meta name="description" content="Outfit AI - Gestiona tu closet digital y genera outfits con IA">
    <meta property="og:title" content="Outfit AI">
    <meta property="og:description" content="Tu closet inteligente con IA - Sube fotos, CLIP analiza, Gemini sugiere outfits">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Anime.js y Lucide via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
</head>

<body>
    <main class="home">
        <h1>OUTFIT</h1>
        <div class="home-grid stagger-children" id="home-grid">
            <a href="closet.html" class="home-card">
                <i data-lucide="shirt"></i>
                <h2>Closet</h2>
                <p>Ver y gestionar tus prendas</p>
            </a>
            <a href="upload.html" class="home-card">
                <i data-lucide="plus"></i>
                <h2>Subir prenda</h2>
                <p>Añadir nueva prenda al closet</p>
            </a>
            <a href="generate.html" class="home-card">
                <i data-lucide="sparkles"></i>
                <h2>Generar outfit</h2>
                <p>Crear combinaciones por ocasión</p>
            </a>
            <a href="history.html" class="home-card">
                <i data-lucide="history"></i>
                <h2>Historial</h2>
                <p>Ver outfits generados</p>
            </a>
        </div>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/ui.js"></script>
    <script src="js/home.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
