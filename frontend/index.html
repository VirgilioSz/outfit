<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit AI</title>
    <meta name="description" content="Outfit AI - Gestiona tu closet digital y genera outfits con IA">
    <meta property="og:title" content="Outfit AI">
    <meta property="og:description" content="Tu closet inteligente con IA - Sube fotos, CLIP analiza, Gemini sugiere outfits">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Anime.js y Lucide via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
    <!-- Weather widget - top right -->
    <div class="weather-widget" id="weather-widget" role="region" aria-label="Clima actual">
        <button class="weather-toggle" id="weather-toggle" aria-label="Mostrar/ocultar clima" aria-expanded="false">
            <i data-lucide="cloud-sun" class="weather-icon-main" id="weather-icon-main" style="width: 20px; height: 20px;"></i>
            <span class="weather-temp" id="weather-temp">--°</span>
        </button>
        <div class="weather-panel" id="weather-panel" hidden>
            <div class="weather-header">
                <h3 class="weather-title">Clima actual</h3>
                <button class="weather-close" id="weather-close" aria-label="Cerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="weather-content">
                <div class="weather-main">
                    <i data-lucide="cloud" class="weather-icon-large" id="weather-icon-large" style="width: 64px; height: 64px;"></i>
                    <div class="weather-temp-group">
                        <span class="weather-temp-large" id="weather-temp-large">--°</span>
                        <span class="weather-desc" id="weather-desc">--</span>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="weather-detail">
                        <i data-lucide="thermometer" class="weather-detail-icon"></i>
                        <span class="weather-detail-label">Sensación</span>
                        <span class="weather-detail-value" id="weather-feels">--°</span>
                    </div>
                    <div class="weather-detail">
                        <i data-lucide="droplets" class="weather-detail-icon"></i>
                        <span class="weather-detail-label">Humedad</span>
                        <span class="weather-detail-value" id="weather-humidity">--%</span>
                    </div>
                </div>
                <div class="weather-location">
                    <i data-lucide="map-pin" class="weather-location-icon"></i>
                    <span id="weather-city">Saltillo, Coahuila, México</span>
                </div>
            </div>
        </div>
    </div>

    <main class="home">
        <h1>OUTFIT</h1>
        <div class="home-grid stagger-children" id="home-grid">
            <a href="closet.html" class="home-card">
                <i data-lucide="shirt"></i>
                <h2>Closet</h2>
                <p>Ver y gestionar tus prendas</p>
            </a>
            <a href="upload.html" class="home-card">
                <i data-lucide="plus"></i>
                <h2>Subir prenda</h2>
                <p>Añadir nueva prenda al closet</p>
            </a>
            <a href="generate.html" class="home-card">
                <i data-lucide="sparkles"></i>
                <h2>Generar outfit</h2>
                <p>Crear combinaciones por ocasión</p>
            </a>
            <a href="history.html" class="home-card">
                <i data-lucide="history"></i>
                <h2>Historial</h2>
                <p>Ver outfits generados</p>
            </a>
        </div>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/ui.js"></script>
    <script src="js/home.js"></script>
    <script src="js/weather.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
