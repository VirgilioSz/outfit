<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Outfit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
    <nav>
        <a class="nav-logo" href="index.html">Outfit</a>
        <ul class="nav-links">
            <li><a href="closet.html">Closet</a></li>
            <li><a href="upload.html">Subir prenda</a></li>
            <li><a href="generate.html" aria-current="page">Generar outfit</a></li>
            <li><a href="history.html">Historial</a></li>
        </ul>
    </nav>

    <div class="contenedor">
        <h1>Generar Outfit</h1>

        <!-- Selector de ocasión -->
        <div class="campo">
            <label for="selector-ocasion">¿Para qué ocasión?</label>
            <div class="custom-select" id="selector-ocasion" data-name="ocasion" aria-label="Ocasión">
                <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Ocasión">
                    <span class="custom-select-value">Trabajo</span>
                    <i data-lucide="chevron-down" class="custom-select-arrow"></i>
                </button>
                <div class="custom-select-panel" role="listbox" aria-label="Ocasiones" hidden>
                    <div class="custom-select-option" data-value="trabajo" role="option" aria-selected="true">Trabajo</div>
                    <div class="custom-select-option" data-value="casual" role="option">Casual</div>
                    <div class="custom-select-option" data-value="cita" role="option">Cita</div>
                    <div class="custom-select-option" data-value="deporte" role="option">Deporte</div>
                    <div class="custom-select-option" data-value="evento-formal" role="option">Evento Formal</div>
                </div>
            </div>
        </div>

        <button id="btn-generar" class="btn-primario">
            <i data-lucide="sparkles"></i> Generar outfit
        </button>

        <!-- Estado de carga -->
        <p id="mensaje-cargando" style="display:none">Generando outfit...</p>

        <!-- Resultado -->
        <div id="resultado-outfit" style="display:none">
            <p id="descripcion-outfit"></p>
            <div class="grid-prendas stagger-children" id="grid-outfit"></div>
        </div>

        <p id="mensaje-error" class="texto-error" style="display:none"></p>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- api.js primero, luego ui.js, luego generate.js -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/generate.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
