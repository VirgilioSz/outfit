<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" stroke="#007ACC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clock / History Dial -->
  <circle cx="40" cy="40" r="26" stroke="#2A2A2A" fill="#141414"/>
  <circle cx="40" cy="40" r="20" stroke="rgba(0,122,204,0.2)"/>
